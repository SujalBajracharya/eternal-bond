spring.config.import=optional:file:./.env[.properties]

# ============================================================
# Spring Application Settings
# ============================================================

spring.application.name=EternalBondAPI

# Render provides the PORT environment variable.
# Locally, fall back to port 8081.
server.port=${PORT:8081}

# ============================================================
# Servlet Session & Security Cookie Configuration
# ============================================================

# Short 15-minute maximum inactive interval for ephemeral
# OAuth2 HTTP sessions.
server.servlet.session.timeout=15m

# Name of the session cookie used by Spring Security OAuth2.
server.servlet.session.cookie.name=JSESSIONID

# Prevent JavaScript from accessing the session cookie.
server.servlet.session.cookie.http-only=true

# Production runs over HTTPS on Render, so the session cookie
# must only be transmitted over HTTPS.
server.servlet.session.cookie.secure=true

# Allows the OAuth session cookie to be sent during the
# OAuth redirect flow while providing CSRF protection.
server.servlet.session.cookie.same-site=Lax

# Use cookies for session tracking.
server.servlet.session.tracking-modes=cookie

# Render runs the application behind a reverse proxy.
# This allows Spring Boot to correctly process forwarded
# HTTPS/host information from Render.
server.forward-headers-strategy=framework


# ============================================================
# Spring Datasource Setup
# ============================================================

# Spring Boot connects directly to the Supabase PostgreSQL
# database.
#
# DB_URL, DB_USERNAME and DB_PASSWORD are supplied through
# Render environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# PostgreSQL/Supabase connection settings.
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false


# ============================================================
# Hibernate Configuration
# ============================================================

# Validate the existing database schema instead of modifying it.
spring.jpa.hibernate.ddl-auto=validate

# Show generated SQL in logs.
spring.jpa.show-sql=true

# PostgreSQL dialect.
# Hibernate 6 can detect PostgreSQL automatically, but keeping
# this is harmless. It can also be removed if desired.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Format generated SQL for easier reading.
spring.jpa.properties.hibernate.format_sql=true

# Hibernate SQL logging.
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE


# ============================================================
# Supabase JWT Configuration
# ============================================================

# Supabase JWT secret used to validate Supabase-generated JWTs.
supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# Supabase REST API configuration.
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}


# ============================================================
# File Upload Settings
# ============================================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# ============================================================
# Mail / Mailtrap Configuration
# ============================================================

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true

# SMTP debugging.
# Consider disabling this in production if you don't need
# detailed SMTP logs.
spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG


# ============================================================
# Google OAuth2 Configuration
# ============================================================

# Google OAuth client credentials are supplied through
# Render environment variables.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

# Information requested from Google.
spring.security.oauth2.client.registration.google.scope=email,profile

# Spring Security's default Google callback is:
#
# {baseUrl}/login/oauth2/code/google
#
# Therefore production uses:
# https://eternal-bond-backend.onrender.com/login/oauth2/code/google
#
# No explicit redirect-uri is necessary here because Spring
# Security generates it automatically.


# ============================================================
# Frontend Application URL
# ============================================================

# Used by the OAuth success handler when redirecting the user
# back to the frontend.
#
# Local development:
# FRONTEND_URL=http://localhost:8080
#
# Production:
# FRONTEND_URL=https://eternal-bond-lac.vercel.app
app.frontend.url=${FRONTEND_URL:http://localhost:8080}


# ============================================================
# Astrology API Configuration
# ============================================================

free-astrology-api.api-key=${FREE_ASTROLOGY_API_KEY}

free-astrology-api.base-url=${FREE_ASTROLOGY_API_BASE_URL:https://json.freeastrologyapi.com}


# ============================================================
# Stripe Configuration
# ============================================================

# Stripe secret/public keys are supplied through Render
# environment variables.
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.public-key=${STRIPE_PUBLIC_KEY}

# Stripe webhook signing secret.
#
# The ':' means an empty default value if the environment
# variable is not configured.
#
# Add STRIPE_WEBHOOK_SECRET to Render after creating the
# production Stripe webhook endpoint.
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}


# ============================================================
# Application Logging
# ============================================================

# Write application logs to a file.
logging.file.name=logs/backend.log

# Application logging level.
logging.level.root=INFO
logging.level.com.eternalbond.api=DEBUG


# ============================================================
# Spring Boot Actuator
# ============================================================

# Expose useful monitoring endpoints.
management.endpoints.web.exposure.include=health,info,metrics,loggers

# Show detailed health information.
management.endpoint.health.show-details=always

# Enable database health check.
management.health.db.enabled=true

# Enable disk-space health check.
management.health.diskspace.enabled=true

# Enable basic ping health check.
management.health.ping.enabled=true

# ============================================================
# CORS Configuration
# ============================================================

# Comma-separated list of allowed origins.
# Local dev falls back to the default below if CORS_ALLOWED_ORIGINS
# isn't set. Production sets it via Render env var.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080,http://localhost:3000}


# ============================================================
# Application Metadata
# ============================================================

info.app.name=EternalBond Matrimonial API

info.app.description=Production ready Spring Boot API backend for Eternal Bond matrimonial platform

info.app.version=0.0.1-SNAPSHOT

management.info.env.enabled=true