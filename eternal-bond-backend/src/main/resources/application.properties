# Spring Application Settings
spring.application.name=EternalBondAPI
server.port=8081

# Spring Datasource Setup
# Spring Boot connects directly to Supabase PostgreSQL database.
# Note: Use transaction/session pooled host link on port 5432 or 6543.
spring.datasource.url=jdbc:postgresql://${SUPABASE_DB_HOST:localhost}:5432/postgres?sslmode=prefer
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Supabase JWT Secret Configuration
# Retrieve this from Supabase Dashboard -> Project Settings -> API -> JWT Secret.
# This secret is used to decode the HS256 JWT tokens generated by Supabase.
supabase.jwt.secret=${SUPABASE_JWT_SECRET:your_shared_jwt_secret_value_here_that_is_at_least_256_bits_long}

