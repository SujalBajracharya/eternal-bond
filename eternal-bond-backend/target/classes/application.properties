spring.config.import=optional:file:./.env[.properties]

# Spring Application Settings
spring.application.name=EternalBondAPI
server.port=8081

# Spring Datasource Setup
# Spring Boot connects directly to Supabase PostgreSQL database.
# Note: Use transaction/session pooled host link on port 5432 or 6543.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Supabase JWT Secret Configuration
# Retrieve this from Supabase Dashboard -> Project Settings -> API -> JWT Secret.
# This secret is used to decode the HS256 JWT tokens generated by Supabase.
supabase.jwt.secret=${SUPABASE_JWT_SECRET}

# Supabase Auth REST Endpoints config
supabase.url=${SUPABASE_URL}
supabase.anon.key=${SUPABASE_ANON_KEY}

# File Upload Settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#MailTrap Configuration
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true

spring.mail.properties.mail.debug=true
logging.level.org.springframework.mail=DEBUG

#Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}

spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=email,profile

# Frontend Application URL (for OAuth success redirects)
# Vite dev server runs on port 8080 (see vite.config.ts)
app.frontend.url=${FRONTEND_URL:http://localhost:8080}

# Astrology API Configuration
free-astrology-api.api-key=${FREE_ASTROLOGY_API_KEY}
free-astrology-api.base-url=${FREE_ASTROLOGY_API_BASE_URL:https://json.freeastrologyapi.com}

# Stripe API Configuration
stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.public-key=${STRIPE_PUBLIC_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}